name: Teste da caixa no Chromium
on:
  pull_request:
    paths:
      - 'app/caixa/**'
      - 'lib/inbox.ts'
      - 'tests/whatsapp.spec.ts'
      - 'supabase/migrations/**'
      - '.github/workflows/test-caixa.yml'
permissions:
  contents: read
jobs:
  caixa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: npm run db -- start
      - run: npm run demo -- --env > /dev/null
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui -- tests/whatsapp.spec.ts
        env:
          CLINELO_TEST_WHATSAPP: '1'
