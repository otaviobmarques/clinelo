name: Testes da recepção no Chromium
on:
  pull_request:
    paths:
      - 'app/page.tsx'
      - 'app/actions.ts'
      - 'app/caixa/**'
      - 'app/api/whatsapp/**'
      - 'lib/whatsapp*.ts'
      - 'playwright.config.ts'
      - 'scripts/mock-whatsapp.mjs'
      - 'app/grade/**'
      - 'app/pacientes/**'
      - 'app/painel/**'
      - 'app/espera/**'
      - 'lib/waiting.ts'
      - 'tests/espera.spec.ts'
      - 'lib/reception.ts'
      - 'tests/painel.spec.ts'
      - 'lib/patients.ts'
      - 'tests/pacientes.spec.ts'
      - 'lib/grade.ts'
      - 'lib/inbox.ts'
      - 'tests/whatsapp.spec.ts'
      - 'tests/caixa.spec.ts'
      - 'tests/recepcao.spec.ts'
      - 'supabase/migrations/**'
      - '.github/workflows/test-caixa.yml'
permissions:
  contents: read
jobs:
  caixa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.39.2
      - run: npm ci
      - run: npm run db -- start
      - run: npm run demo -- --env > /dev/null
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:agenda
      - run: npm run test:google
      - run: npm run build
      - run: npm run test:ui -- tests/whatsapp.spec.ts tests/caixa.spec.ts tests/recepcao.spec.ts tests/pacientes.spec.ts tests/painel.spec.ts tests/espera.spec.ts --workers=1
        env:
          CLINELO_TEST_WHATSAPP: '1'
